name: Midnight DApp CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Next.js
      run: npm run build

    - name: Run Tests
      run: npm run test

    # Midnight specific build steps will be added here once compact compiler is in CI
    # - name: Compile Compact Contract
    #   run: compactc contracts/PrivateDataProof.compact

name: PrivateData AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Test & ZK Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --no-audit

      - name: Run Cryptographic ZK & Architecture Tests
        run: node tests/runner.js

      - name: Validate Compact DSL Contract Syntax
        run: |
          echo "Checking Compact contract privatedata_ai.compact..."
          test -f midnight/contract/privatedata_ai.compact
          grep -q "circuit verify_dataset_qualification" midnight/contract/privatedata_ai.compact
          echo "Compact DSL syntax verified."

      - name: Build Next.js Application Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          MIDNIGHT_USE_LIVE: false
